<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PredVisit — Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark"><img src="/image.png" alt="PredVisit"></div>
      <div><span class="brand-name">PredVisit</span><span class="brand-sub">Medical Assistant</span></div>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item" onclick="window.location.href='/?view=chat'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>AI Chat</button>
      <button class="nav-item" onclick="window.location.href='/?view=dashboard'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Analytics</button>
      <button class="nav-item" onclick="window.location.href='/?view=patients'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Patients</button>
      <button class="nav-item active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>Operations</button>
      <button class="nav-item" onclick="window.location.href='/staff.html'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6m3-3h-6"/></svg>Medical Staff</button>
      <button class="nav-item" onclick="window.location.href='/groupchat.html'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>Group Chat</button>
      <div class="nav-sep"></div>
      <div class="chat-list-header"><span>Chat history</span><button class="btn-new-chat" onclick="sessionStorage.removeItem('medai_chat_id');window.location.href='/?view=chat'" title="New chat">+</button></div>
      <div class="chat-list" id="chatListExt"></div>
    </nav>
    <div class="sidebar-bottom"><div class="status-dot"></div><span class="user-email" id="userEmail">—</span><button class="btn-logout" onclick="AUTH.logout()">Logout</button></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <h1 class="topbar-title">Operations & Procedures</h1>
      <button class="btn-primary" onclick="openOpModal()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>New Operation</button>
    </header>
    <div class="scroll-area">
      <div class="kpi-row" id="opKpi"></div>
      <div class="filters-strip">
        <div class="fi"><label>Search</label><input id="opSearch" placeholder="Name..." oninput="debounceOps()"></div>
        <div class="fi"><label>Status</label><select id="opStatus" onchange="loadOps()"><option value="">All</option><option>Planned</option><option>In progress</option><option>Completed</option><option>Cancelled</option></select></div>
        <div class="fi"><label>Department</label><select id="opDept" onchange="loadOps()"><option value="">All</option><option>Pulmonology</option><option>Cardiology</option><option>Gastroenterology</option><option>Nephrology</option><option>Endocrinology</option><option>Neurology</option><option>Rheumatology</option><option>Traumatology</option><option>Hematology</option><option>Psychiatry</option><option>Otorhinolaryngology</option><option>Infectious diseases</option><option>Surgery</option><option>Urology</option><option>Therapy</option></select></div>
        <button class="btn-ghost" onclick="document.getElementById('opSearch').value='';document.getElementById('opStatus').value='';document.getElementById('opDept').value='';loadOps()">Reset</button>
      </div>
      <div class="tbl-scroll">
        <table class="tbl"><thead><tr><th>Operation</th><th>Patient</th><th>IIN</th><th>Date</th><th>Surgeon</th><th>Department</th><th>Status</th><th>Notes</th><th></th></tr></thead><tbody id="opsBody"></tbody></table>
      </div>
      <div class="pager" id="opsPager"></div>
    </div>
  </main>

  <!-- Add operation modal -->
  <div class="overlay" id="opOverlay" onclick="closeOpModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head"><h2>New Operation</h2><button class="modal-x" onclick="closeOpModal()">&times;</button></div>
      <div class="modal-body">
        <div class="fg"><label>Operation Name <em>*</em></label><input id="opName" placeholder="Appendectomy"></div>
        <div class="fg2"><div class="fg"><label>Patient (name)</label><input id="opPatient" placeholder="Akhmetov Nurdaulet"></div><div class="fg"><label>Patient IIN</label><input id="opIin" placeholder="1001"></div></div>
        <div class="fg2"><div class="fg"><label>Date <em>*</em></label><input type="date" id="opDate"></div><div class="fg"><label>Surgeon</label><input id="opSurgeon" placeholder="Petrov A.A."></div></div>
        <div class="fg"><label>Department</label><select id="opDeptSel"><option>Pulmonology</option><option>Cardiology</option><option>Gastroenterology</option><option>Nephrology</option><option>Endocrinology</option><option>Neurology</option><option>Rheumatology</option><option>Traumatology</option><option>Hematology</option><option>Psychiatry</option><option>Otorhinolaryngology</option><option>Infectious diseases</option><option>Surgery</option><option>Urology</option><option>Therapy</option></select></div>
        <div class="fg"><label>Status</label><select id="opStatusSel"><option>Planned</option><option>In progress</option><option>Completed</option><option>Cancelled</option></select></div>
        <div class="fg"><label>Notes</label><textarea id="opNotes" placeholder="Additional information..."></textarea></div>
      </div>
      <div class="modal-foot"><button class="btn-ghost" onclick="closeOpModal()">Cancel</button><button class="btn-primary" onclick="submitOp()">Add</button></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/lang.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/notify.js"></script>
  <script>
    var opPage = 0, opTimer = null;

    var currentUserEmail='';
    (async function() {
      var user = await AUTH.getUser();
      if (!user) { window.location.href = '/login.html'; return; }
      currentUserEmail=user.email||'';
      document.getElementById('userEmail').textContent = currentUserEmail;
      loadOps();
      loadExtChatList();
    })();

    async function loadExtChatList(){
      var el=document.getElementById('chatListExt');if(!el||!currentUserEmail)return;
      try{
        var res=await fetch('/api/chats?email='+encodeURIComponent(currentUserEmail));
        var d=await res.json();var chats=d.data||[];
        el.innerHTML=chats.length===0?'<div style="padding:8px 14px;font-size:.75rem;color:#9ca3af">No chats</div>':chats.map(function(c){
          return '<div class="chat-item" onclick="sessionStorage.setItem(\'medai_chat_id\',\''+c.id+'\');window.location.href=\'/?view=chat\'"><span class="chat-item-title">'+(c.title||'Chat')+'</span></div>';
        }).join('');
      }catch(e){}
    }

    function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}

    async function loadOps() {
      var p = new URLSearchParams();
      var s = document.getElementById('opSearch').value.trim();
      var st = document.getElementById('opStatus').value;
      var dp = document.getElementById('opDept').value;
      if (s) p.set('search', s);
      if (st) p.set('status', st);
      if (dp) p.set('department', dp);
      p.set('page', opPage); p.set('pageSize', 30);

      try {
        var res = await fetch('/api/operations?' + p.toString());
        var data = await res.json();
        renderOps(data);
      } catch(e) {
        document.getElementById('opsBody').innerHTML = '<tr><td colspan="9" style="text-align:center;color:#ef4444;padding:30px">' + esc(e.message) + '</td></tr>';
      }
    }

    function statusTag(s) {
      var cls = s === 'Completed' ? 'tag-done' : s === 'In progress' ? 'tag-active' : s === 'Cancelled' ? 'tag-cancel' : 'tag-planned';
      return '<span class="tag tag-status ' + cls + '">' + esc(s) + '</span>';
    }

    function renderOps(data) {
      var planned = 0, active = 0, done = 0;
      (data.data || []).forEach(function(o) {
        if (o.status === 'Planned') planned++;
        else if (o.status === 'In progress') active++;
        else if (o.status === 'Completed') done++;
      });
      document.getElementById('opKpi').innerHTML =
        '<div class="kpi"><div class="kpi-label">Total</div><div class="kpi-val">' + (data.count || 0) + '</div></div>' +
        '<div class="kpi"><div class="kpi-label">Planned</div><div class="kpi-val" style="color:#3b82f6">' + planned + '</div></div>' +
        '<div class="kpi"><div class="kpi-label">In progress</div><div class="kpi-val" style="color:#d97706">' + active + '</div></div>' +
        '<div class="kpi"><div class="kpi-label">Completed</div><div class="kpi-val" style="color:#10b981">' + done + '</div></div>';

      var tb = document.getElementById('opsBody');
      if (!data.data || !data.data.length) {
        tb.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#9ca3af;padding:40px">No operations yet</td></tr>';
        return;
      }
      tb.innerHTML = data.data.map(function(o) {
        return '<tr><td><strong>' + esc(o.operation_name) + '</strong></td><td>' + esc(o.patient_name || '—') + '</td><td class="icd-code">' + esc(o.patient_iin || '—') + '</td><td>' + (o.operation_date || '—') + '</td><td>' + esc(o.surgeon || '—') + '</td><td><span class="tag tag-dept">' + esc(o.department || '—') + '</span></td><td>' + statusTag(o.status) + '</td><td style="font-size:.76rem;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(o.notes || '') + '</td><td><button class="btn-del-sm" onclick="deleteOp(' + o.id + ')">✕</button></td></tr>';
      }).join('');
    }

    function debounceOps() { clearTimeout(opTimer); opTimer = setTimeout(loadOps, 350); }

    function openOpModal() { document.getElementById('opOverlay').classList.add('open'); }
    function closeOpModal(e) { if (e && e.target !== e.currentTarget) return; document.getElementById('opOverlay').classList.remove('open'); }

    async function submitOp() {
      var name = document.getElementById('opName').value.trim();
      var date = document.getElementById('opDate').value;
      if (!name || !date) { alert('Fill in name and date'); return; }
      try {
        var res = await fetch('/api/operations', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({
            operation_name: name, patient_name: document.getElementById('opPatient').value.trim() || null,
            patient_iin: document.getElementById('opIin').value.trim() || null,
            operation_date: date, surgeon: document.getElementById('opSurgeon').value.trim() || null,
            department: document.getElementById('opDeptSel').value, status: document.getElementById('opStatusSel').value,
            notes: document.getElementById('opNotes').value.trim() || null
          })
        });
        var data = await res.json();
        if (data.error) { alert(data.error); return; }
        closeOpModal(); loadOps();
        ['opName','opPatient','opIin','opSurgeon','opNotes'].forEach(function(id){ document.getElementById(id).value = ''; });
      } catch(e) { alert(e.message); }
    }

    async function deleteOp(id) {
      if (!confirm('Delete operation?')) return;
      try { await fetch('/api/operations?id=' + id, {method:'DELETE'}); loadOps(); } catch(e) { alert(e.message); }
    }
  </script>
</body>
</html>
