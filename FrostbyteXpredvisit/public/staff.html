<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PredVisit — Staff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark"><img src="/image.png" alt="PredVisit"></div>
      <div><span class="brand-name">PredVisit</span><span class="brand-sub">Medical Assistant</span></div>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item" onclick="window.location.href='/?view=chat'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>AI Chat</button>
      <button class="nav-item" onclick="window.location.href='/?view=dashboard'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Analytics</button>
      <button class="nav-item" onclick="window.location.href='/?view=patients'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>Patients</button>
      <button class="nav-item" onclick="window.location.href='/operations.html'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>Operations</button>
      <button class="nav-item active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6m3-3h-6"/></svg>Medical Staff</button>
      <button class="nav-item" onclick="window.location.href='/groupchat.html'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>Group Chat</button>
      <div class="nav-sep"></div>
      <div class="chat-list-header"><span>Chat History</span><button class="btn-new-chat" onclick="window.location.href='/?view=chat'" title="New chat">+</button></div>
      <div class="chat-list" id="chatListExt"></div>
    </nav>
    <div class="sidebar-bottom"><div class="status-dot"></div><span class="user-email" id="userEmail">—</span><button class="btn-logout" onclick="AUTH.logout()">Logout</button></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <h1 class="topbar-title">Medical Personnel</h1>
      <button class="btn-primary" onclick="openStaffModal()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add Staff</button>
    </header>
    <div class="scroll-area">
      <div class="kpi-row" id="staffKpi"></div>
      <div class="filters-strip">
        <div class="fi"><label>Search</label><input id="sSearch" placeholder="Name..." oninput="debounceStaff()"></div>
        <div class="fi"><label>Department</label><select id="sDept" onchange="loadStaff()"><option value="">All</option><option>Pulmonology</option><option>Cardiology</option><option>Gastroenterology</option><option>Nephrology</option><option>Endocrinology</option><option>Neurology</option><option>Rheumatology</option><option>Traumatology</option><option>Hematology</option><option>Psychiatry</option><option>Otorhinolaryngology</option><option>Infectious diseases</option><option>Therapy</option></select></div>
        <div class="fi"><label>Role</label><select id="sRole" onchange="loadStaff()"><option value="">All</option><option>Doctor</option><option>Nurse</option><option>Paramedic</option><option>Orderly</option></select></div>
      </div>

      <div id="staffCards" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px"></div>
    </div>
  </main>

  <!-- Add staff modal -->
  <div class="overlay" id="staffOverlay" onclick="closeStaffModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head"><h2 id="staffModalTitle">New Staff Member</h2><button class="modal-x" onclick="closeStaffModal()">&times;</button></div>
      <div class="modal-body">
        <div class="fg"><label>Full Name <em>*</em></label><input id="sfName" placeholder="Ivanov Ivan Ivanovich"></div>
        <div class="fg2">
          <div class="fg"><label>Role</label><select id="sfRole"><option>Doctor</option><option>Nurse</option><option>Paramedic</option><option>Orderly</option></select></div>
          <div class="fg"><label>Department</label><select id="sfDept"><option>Pulmonology</option><option>Cardiology</option><option>Gastroenterology</option><option>Nephrology</option><option>Endocrinology</option><option>Neurology</option><option>Rheumatology</option><option>Traumatology</option><option>Hematology</option><option>Psychiatry</option><option>Otorhinolaryngology</option><option>Infectious diseases</option><option>Therapy</option></select></div>
        </div>
        <div class="fg2">
          <div class="fg"><label>Specialization</label><input id="sfSpec" placeholder="Cardiologist"></div>
          <div class="fg"><label>Phone</label><input id="sfPhone" placeholder="+7 777 123 4567"></div>
        </div>
        <div class="fg"><label>Email</label><input id="sfEmail" placeholder="doctor@hospital.kz"></div>
      </div>
      <div class="modal-foot"><button class="btn-ghost" onclick="closeStaffModal()">Cancel</button><button class="btn-primary" onclick="submitStaff()">Save</button></div>
    </div>
  </div>

  <!-- Patient list side panel -->
  <div class="side-panel" id="sidePanel">
    <div class="sp-head"><h3 id="spTitle">Patients</h3><button class="modal-x" onclick="document.getElementById('sidePanel').classList.remove('open')">&times;</button></div>
    <div class="sp-body" id="spBody"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/lang.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/notify.js"></script>
  <script>
    var staffTimer=null, currentUserEmail='';
    (async function(){
      var user=await AUTH.getUser();
      if(!user){window.location.href='/login.html';return}
      currentUserEmail=user.email||'';
      document.getElementById('userEmail').textContent=currentUserEmail;
      loadStaff();
      loadExtChatList();
    })();

    async function loadExtChatList(){
      var el=document.getElementById('chatListExt');if(!el||!currentUserEmail)return;
      try{
        var res=await fetch('/api/chats?email='+encodeURIComponent(currentUserEmail));
        var d=await res.json();var chats=d.data||[];
        el.innerHTML=chats.length===0?'<div style="padding:8px 14px;font-size:.75rem;color:#9ca3af">No chats</div>':chats.map(function(c){
          return '<div class="chat-item" onclick="sessionStorage.setItem(\'medai_chat_id\',\''+c.id+'\');window.location.href=\'/?view=chat\'"><span class="chat-item-title">'+esc(c.title||'Chat')+'</span></div>';
        }).join('');
      }catch(e){}
    }

    function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML}
    function debounceStaff(){clearTimeout(staffTimer);staffTimer=setTimeout(loadStaff,350)}

    async function loadStaff(){
      try{
        var res=await fetch('/api/staff?stats=true');
        var d=await res.json();
        var staff=d.data||[];

        var totalStaff=staff.length;
        var totalPatients=staff.reduce(function(s,x){return s+x.patient_count},0);
        var depts=[...new Set(staff.map(function(x){return x.department}))].length;
        document.getElementById('staffKpi').innerHTML=
          '<div class="kpi"><div class="kpi-label">Staff</div><div class="kpi-val">'+totalStaff+'</div></div>'+
          '<div class="kpi"><div class="kpi-label">Patients under doctors</div><div class="kpi-val">'+totalPatients+'</div></div>'+
          '<div class="kpi"><div class="kpi-label">Departments</div><div class="kpi-val">'+depts+'</div></div>';

        var search=(document.getElementById('sSearch').value||'').toLowerCase();
        var dept=document.getElementById('sDept').value;
        var role=document.getElementById('sRole').value;
        var filtered=staff.filter(function(s){
          if(search&&s.full_name.toLowerCase().indexOf(search)===-1)return false;
          if(dept&&s.department!==dept)return false;
          if(role&&s.role!==role)return false;
          return true;
        });

        document.getElementById('staffCards').innerHTML=filtered.length===0
          ?'<div style="grid-column:1/-1;text-align:center;color:#9ca3af;padding:40px">No staff found</div>'
          :filtered.map(function(s){
            var today=new Date();
            var patientsHtml=s.patients.slice(0,5).map(function(p){
              var days='—';
              if(p.admission_date){
                var ad=new Date(p.admission_date);
                days=Math.max(1,Math.ceil((today-ad)/(1000*60*60*24)))+' days';
              }
              return '<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:.78rem"><span>'+esc(p.patient_name)+'</span><span style="color:#6b7280">'+esc(p.diagnosis).substring(0,25)+'</span><span style="color:#7c3aed;font-weight:600">'+days+'</span></div>';
            }).join('');
            if(s.patient_count>5)patientsHtml+='<div style="font-size:.72rem;color:#9ca3af;margin-top:4px">and '+(s.patient_count-5)+' more...</div>';
            return '<div class="card" style="cursor:default"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px"><div><div style="font-weight:600;font-size:.95rem">'+esc(s.full_name)+'</div><div style="font-size:.78rem;color:#6b7280">'+esc(s.role)+' · '+esc(s.specialization||'')+'</div></div><div style="display:flex;gap:4px"><button class="btn-del-sm" onclick="deleteStaffItem('+s.id+')" title="Delete">✕</button></div></div><div style="display:flex;gap:8px;margin-bottom:10px"><span class="tag tag-dept">'+esc(s.department)+'</span><span class="tag tag-ok" style="background:#f5f3ff;color:#7c3aed">'+s.patient_count+' patients</span></div>'+(s.phone?'<div style="font-size:.75rem;color:#6b7280;margin-bottom:4px">📞 '+esc(s.phone)+'</div>':'')+(s.email?'<div style="font-size:.75rem;color:#6b7280;margin-bottom:8px">✉ '+esc(s.email)+'</div>':'')+(s.patient_count>0?'<div style="border-top:1px solid #e5e7eb;padding-top:8px;margin-top:4px"><div style="font-size:.72rem;color:#9ca3af;text-transform:uppercase;letter-spacing:.4px;font-weight:500;margin-bottom:6px">Current patients</div>'+patientsHtml+'</div>':'<div style="font-size:.78rem;color:#9ca3af;margin-top:8px">No patients</div>')+'</div>';
          }).join('');
      }catch(e){
        document.getElementById('staffCards').innerHTML='<div style="color:#ef4444;padding:20px">'+esc(e.message)+'</div>';
      }
    }

    function openStaffModal(){document.getElementById('staffOverlay').classList.add('open')}
    function closeStaffModal(e){if(e&&e.target!==e.currentTarget)return;document.getElementById('staffOverlay').classList.remove('open')}

    async function submitStaff(){
      var name=document.getElementById('sfName').value.trim();
      if(!name){alert('Enter full name');return}
      try{
        var res=await fetch('/api/staff',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
          full_name:name,role:document.getElementById('sfRole').value,
          department:document.getElementById('sfDept').value,
          specialization:document.getElementById('sfSpec').value.trim()||null,
          phone:document.getElementById('sfPhone').value.trim()||null,
          email:document.getElementById('sfEmail').value.trim()||null
        })});
        var d=await res.json();
        if(d.error){alert(d.error);return}
        closeStaffModal();loadStaff();
        ['sfName','sfSpec','sfPhone','sfEmail'].forEach(function(id){document.getElementById(id).value=''});
      }catch(e){alert(e.message)}
    }

    async function deleteStaffItem(id){
      if(!confirm('Delete staff member?'))return;
      try{await fetch('/api/staff?id='+id,{method:'DELETE'});loadStaff()}catch(e){alert(e.message)}
    }
  </script>
</body>
</html>
